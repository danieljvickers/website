# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Daniel J. Vickers"
title: "PhD Student"
institution: "Georgia Institute of Technology"
email: dvickers6@gatech.edu
photo: face.png  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=EJ5k-8cAAAAJ&hl"
  github: "https://github.com/danieljvickers"
  researchgate: "https://www.researchgate.net/profile/Daniel-Vickers-4"
  orcid: "https://orcid.org/0000-0002-5231-5528"
  twitter: ""
  linkedin: "https://www.linkedin.com/in/daniel-vickers-857821126/"
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#60A5FA"      # theme color for links and buttons
dark_mode: true              # show dark mode toggle in navbar
description: "Academic webpage of Daniel J. VIckers"
baseurl: ""
url: "https://www.danieljvickers.com"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: presentations
  # - name: research
  - name: visualizations
  - name: blog

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

# Blog posts live in _blog/ as plain .md files (e.g. _blog/solar_slab.md).
# Each one is paired with a cover image in _data/blog.yml.
collections:
  blog:
    output: true
    permalink: /blog/:name/

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: post

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Vickers
  first_name: [Daniel]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
