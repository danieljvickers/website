# ============================================================
# Visualizations
# ------------------------------------------------------------
# One entry per video / animation. The list is shown in reverse:
# the LAST entry in this file appears first on the page, so add
# new visualizations to the bottom.
#
# Paste the ordinary share link
# and the preview image is pulled from the host automatically --
# you do not need to save a thumbnail anywhere.
#
#   title:        shown under the preview (required)
#   url:          YouTube, Google Drive, or Vimeo link (required)
#   description:  (optional) a sentence or two of context
#   image:        (optional) override the automatic thumbnail with
#                 a file you put in images/visualizations/
#
# Supported link formats:
#   https://www.youtube.com/watch?v=VIDEOID
#   https://youtu.be/VIDEOID
#   https://drive.google.com/file/d/FILEID/view?usp=sharing
#   https://vimeo.com/VIDEOID          (needs a manual image:)
#
# Google Drive files must be shared as "Anyone with the link"
# for the preview and inline player to work.
# ============================================================

